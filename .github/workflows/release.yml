name: release

# Cut a release by pushing a tag like v0.1.0:
#   git tag v0.1.0 && git push origin v0.1.0
# This builds prebuilt binaries for macOS (arm64 + x64) and Linux (x64),
# packages each as noworries-<target>.tar.gz with a .sha256, and attaches them
# to the GitHub Release. install.sh / Homebrew / npm all download these.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/noworries"
          out="noworries-${{ matrix.target }}.tar.gz"
          tar -czf "$out" -C "target/${{ matrix.target }}/release" noworries
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$out" > "$out.sha256"
          else
            sha256sum "$out" > "$out.sha256"
          fi
          echo "ASSET=$out" >> "$GITHUB_ENV"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            noworries-${{ matrix.target }}.tar.gz
            noworries-${{ matrix.target }}.tar.gz.sha256
