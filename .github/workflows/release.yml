name: release

# Release on merge to main — but only when the version in Cargo.toml is new
# (no tag v<version> yet). So: bump `version` in Cargo.toml in your PR, merge to
# main, and this publishes to GitHub Releases + npm + the Homebrew tap.
#
# Required repo secrets:
#   NPM_TOKEN            npm automation token (npm publish)
#   HOMEBREW_TAP_TOKEN   PAT with `repo` scope on guvense/homebrew-noworries
#
# The tap repo `guvense/homebrew-noworries` must exist.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  REPO: guvense/noworries
  TAP_REPO: guvense/homebrew-noworries

jobs:
  guard:
    name: decide whether to release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      should_release: ${{ steps.v.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag already released — skipping."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing $tag."
          fi

  build:
    name: build ${{ matrix.target }}
    needs: guard
    if: needs.guard.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="noworries-${{ matrix.target }}.tar.gz"
          tar -czf "$out" -C "target/${{ matrix.target }}/release" noworries
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$out" > "$out.sha256"
          else
            sha256sum "$out" > "$out.sha256"
          fi
      - name: Create/append GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.guard.outputs.tag }}
          name: ${{ needs.guard.outputs.tag }}
          files: |
            noworries-${{ matrix.target }}.tar.gz
            noworries-${{ matrix.target }}.tar.gz.sha256
      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: sha-${{ matrix.target }}
          path: noworries-${{ matrix.target }}.tar.gz.sha256

  npm:
    name: publish to npm
    needs: [guard, build]
    if: needs.guard.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Sync version + publish
        working-directory: dist/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm version "${{ needs.guard.outputs.version }}" --no-git-tag-version --allow-same-version
          npm publish --access public

  homebrew:
    name: update Homebrew tap
    needs: [guard, build]
    if: needs.guard.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Get checksums
        uses: actions/download-artifact@v4
        with:
          pattern: sha-*
          path: sha
          merge-multiple: false
      - name: Check out tap
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Render formula
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          arm="$(cut -d' ' -f1 sha/sha-aarch64-apple-darwin/*.sha256)"
          intel="$(cut -d' ' -f1 sha/sha-x86_64-apple-darwin/*.sha256)"
          linux="$(cut -d' ' -f1 sha/sha-x86_64-unknown-linux-gnu/*.sha256)"
          mkdir -p tap/Formula
          cat > tap/Formula/noworries.rb <<RB
          class Noworries < Formula
            desc "Ephemeral infra harness that lets an AI verify the changes it just made"
            homepage "https://github.com/${REPO}"
            version "${version}"
            license "MIT"

            BASE = "https://github.com/${REPO}/releases/download/v#{version}".freeze

            on_macos do
              on_arm do
                url "#{BASE}/noworries-aarch64-apple-darwin.tar.gz"
                sha256 "${arm}"
              end
              on_intel do
                url "#{BASE}/noworries-x86_64-apple-darwin.tar.gz"
                sha256 "${intel}"
              end
            end

            on_linux do
              on_intel do
                url "#{BASE}/noworries-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${linux}"
              end
            end

            def install
              bin.install "noworries"
            end

            def caveats
              <<~EOS
                Install the /noworries slash command for Claude Code (once):
                  noworries install-command

                noworries needs Docker running when you use it.
              EOS
            end

            test do
              assert_match "noworries", shell_output("#{bin}/noworries --version")
            end
          end
          RB
      - name: Commit + push formula
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/noworries.rb
          if git diff --cached --quiet; then
            echo "formula unchanged"
          else
            git commit -m "noworries ${{ needs.guard.outputs.version }}"
            git push
          fi
