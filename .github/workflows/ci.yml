name: ci

# Runs on every push / PR. Builds, lints, and — crucially — runs the
# integration tests against REAL Postgres, Redis, Kafka, and Elasticsearch
# (brought up with ci/docker-compose.yml). This is what catches client-library
# misuse (e.g. the Kafka consumer "offset storage" bug) that compile checks and
# unit tests cannot.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build + clippy + unit tests
        run: |
          cargo build --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo test --lib
          # in-process tests (no Docker): mock server, graphql/metrics/sse/ws/snapshot,
          # OTel traces (fake Jaeger), gRPC (fake grpcurl; unix-only, no-op on Windows)
          cargo test --test mock_it --test checks_it --test traces_it --test grpc_it

      - name: Start real infrastructure
        run: docker compose -f ci/docker-compose.yml up -d --wait

      - name: Integration tests (real Kafka / Elasticsearch / MySQL / MongoDB / Postgres)
        env:
          NOWORRIES_IT_KAFKA_PORT: "9092"
          NOWORRIES_IT_ES_PORT: "9200"
          NOWORRIES_IT_MYSQL_PORT: "3306"
          NOWORRIES_IT_MONGO_PORT: "27017"
          NOWORRIES_IT_PG_PORT: "5432"
        run: cargo test --test kafka_it --test elastic_it --test mysql_it --test mongo_it --test scenario_it --test schema_it -- --nocapture

      # Copy the Flink image's built-in streaming example so the flink_it test can
      # submit a real job (upload -> run -> poll RUNNING) without building one.
      - name: Stage Flink example jar
        run: |
          docker compose -f ci/docker-compose.yml cp \
            flink-jobmanager:/opt/flink/examples/streaming/TopSpeedWindowing.jar \
            ./flink-example.jar
          ls -la ./flink-example.jar

      - name: Integration test (real Flink cluster — submit path)
        env:
          NOWORRIES_IT_FLINK_PORT: "8081"
          NOWORRIES_IT_FLINK_JAR: "./flink-example.jar"
        run: cargo test --test flink_it -- --nocapture

      - name: Tear down infrastructure
        if: always()
        run: docker compose -f ci/docker-compose.yml down -v

  # Native-Windows compile gate. The Unix/Windows process handling is cfg-split
  # (src/app.rs::kill_tree, shell_command), and only a real Windows build proves
  # the cfg(windows) branch compiles — the same reason we run real-service ITs.
  # Integration tests need Docker services, so this job runs build + unit tests.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build + clippy + unit tests (native Windows)
        run: |
          cargo build --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo test --lib
          # in-process tests (no Docker): mock server, graphql/metrics/sse/ws/snapshot,
          # OTel traces (fake Jaeger), gRPC (fake grpcurl; unix-only, no-op on Windows)
          cargo test --test mock_it --test checks_it --test traces_it --test grpc_it
