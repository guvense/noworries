# Heavy infrastructure for the SQL Server + Cassandra integration tests. These
# images are large and slow to boot (Cassandra especially), so they live in a
# SEPARATE compose stack driven by a SEPARATE CI job (see the `integration-heavy`
# job in .github/workflows/ci.yml) to keep the main integration job fast.
#
# Both checks query the datastore with the client baked into the image via
# `docker compose exec`, so the tests need this project name + file (passed as
# NOWORRIES_IT_COMPOSE_PROJECT / NOWORRIES_IT_COMPOSE_FILE).
name: noworries-ci-heavy
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Noworries!Pass1"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Noworries!Pass1' -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s

  cassandra:
    image: cassandra:5.0
    environment:
      # Keep the JVM modest so it fits a CI runner.
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 60s
