[package]
name = "noworries"
version = "0.3.0"
edition = "2021"
description = "Ephemeral infra harness that lets an AI verify the changes it just made — stand up the dependencies a feature needs, exercise them, and report READY/NOT READY."
license = "MIT"

[[bin]]
name = "noworries"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
anyhow = "1"
ctrlc = "3"
ureq = { version = "2", default-features = false }
postgres = "0.19"
libc = "0.2"
# default features drop "security" (openssl) — we only use plaintext Kafka, so
# this avoids a system OpenSSL build dependency. Keep gzip/snappy (pure-Rust).
kafka = { version = "0.10", default-features = false, features = ["gzip", "snappy"] }
redis = "0.27"
# minimal features -> no native-tls/openssl (we only talk plaintext to localhost).
mysql = { version = "25", default-features = false, features = ["minimal"] }
# sync feature (bundles its own runtime); no TLS -> no openssl (localhost plaintext).
mongodb = { version = "2.8", default-features = false, features = ["sync"] }

[profile.release]
strip = true
lto = true
